<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>Cotizador - New Estimate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f0f0f0; color: #111827; max-width: 375px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .header { background: #0f3167; color: #fff; padding: 16px; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .back { font-size: 14px; opacity: 0.8; margin-bottom: 4px; }

  .form-section { background: #fff; margin: 12px 16px; border-radius: 8px; border: 1px solid #d1d5db; padding: 16px; }
  .section-label { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 4px; }
  .field input, .field select { width: 100%; height: 48px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 12px; font-size: 16px; font-family: inherit; color: #111827; background: #fff; }
  .field input:focus, .field select:focus { outline: none; border-color: #0f3167; box-shadow: 0 0 0 2px rgba(15,49,103,0.15); }
  .field input::placeholder { color: #9ca3af; }

  .job-type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .job-type-btn { height: 64px; border: 2px solid #d1d5db; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 500; color: #374151; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .job-type-btn .icon { font-size: 20px; }
  .job-type-btn.selected { border-color: #0f3167; background: #e8f0fa; color: #0f3167; }

  .bottom-bar { margin-top: auto; background: #fff; border-top: 1px solid #d1d5db; padding: 16px; }
  .btn-primary { width: 100%; height: 48px; background: #0f3167; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .quick-fill { display: flex; align-items: center; gap: 8px; padding: 12px; background: #e8f0fa; border-radius: 8px; margin-bottom: 16px; font-size: 13px; color: #0f3167; }
  .quick-fill .badge { background: #83bde8; color: #0f3167; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="header">
    <div class="back">< Back to Estimates</div>
    <h1>New Estimate</h1>
  </div>

  <!-- Quick fill suggestion -->
  <div style="padding: 12px 16px 0;">
    <div class="quick-fill">
      <span class="badge">TIP</span>
      Fill in customer name and address. Everything else is optional for now.
    </div>
  </div>

  <!-- Customer Info -->
  <div class="form-section">
    <div class="section-label">Customer Information</div>
    <div class="field">
      <label>Customer Name *</label>
      <input type="text" placeholder="e.g., Maria Rodriguez">
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="tel" placeholder="(555) 123-4567">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="customer@email.com">
    </div>
  </div>

  <!-- Property -->
  <div class="form-section">
    <div class="section-label">Property</div>
    <div class="field">
      <label>Property Address *</label>
      <input type="text" placeholder="1423 Oak Creek Dr, Houston TX">
    </div>
    <div class="field">
      <label>Property Type</label>
      <select>
        <option>Residential</option>
        <option>Commercial</option>
      </select>
    </div>
  </div>

  <!-- Job Type -->
  <div class="form-section">
    <div class="section-label">Job Type</div>
    <div class="job-type-grid">
      <button class="job-type-btn selected">
        <span class="icon">💧</span>
        Water Damage
      </button>
      <button class="job-type-btn">
        <span class="icon">🦠</span>
        Mold
      </button>
      <button class="job-type-btn">
        <span class="icon">🔥</span>
        Fire/Smoke
      </button>
      <button class="job-type-btn">
        <span class="icon">📋</span>
        Other
      </button>
    </div>
  </div>

  <!-- Damage Category (water-specific) -->
  <div class="form-section">
    <div class="section-label">Damage Category</div>
    <div class="field">
      <select>
        <option>Category 1 — Clean Water</option>
        <option>Category 2 — Gray Water</option>
        <option>Category 3 — Black Water</option>
      </select>
    </div>
    <div class="field">
      <label>Source of Damage</label>
      <input type="text" placeholder="e.g., Burst pipe under kitchen sink">
    </div>
  </div>

  <!-- CTA -->
  <div class="bottom-bar">
    <button class="btn-primary">Start Estimate →</button>
  </div>
</body>
</html>
